[package]
name = "sentinal_rust_core"
version = "1.0.0"
edition = "2021"
authors = ["Sentinal Systems Engineering"]
description = "Deterministic Focus State Machine, Notification Priority Classifier, and Call Bouncer Cooldown Engine for Sentinal Android"

[lib]
name = "sentinal_rust_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
